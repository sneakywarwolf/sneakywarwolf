name: Sync README from blog

on:
  schedule:
    - cron: "17 2 * * *"      # daily, 02:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [blog-updated]   # sent by the blog's deploy workflow (optional)
  push:
    branches: [main, master]
    paths:
      - scripts/sync_site.py
      - .github/workflows/sync-site.yml

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Pull certifications, projects and posts from sneakywarwolf.github.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_site.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: sync from sneakywarwolf.github.io"
          git push
